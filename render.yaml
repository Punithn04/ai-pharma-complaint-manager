services:
  - type: web
    name: aivoa-complaint-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_EXTRACTION_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FAST_MODEL
        value: openai/gpt-oss-20b
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/backend/complaints.db
      - key: CORS_ORIGINS
        sync: false
