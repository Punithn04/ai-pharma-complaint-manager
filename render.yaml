databases:
  - name: aivoa-complaints-db
    plan: free
    databaseName: aivoa_complaints
    user: aivoa

services:
  - type: web
    name: aivoa-complaint-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_EXTRACTION_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FAST_MODEL
        value: openai/gpt-oss-20b
      - key: DATABASE_URL
        fromDatabase:
          name: aivoa-complaints-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
